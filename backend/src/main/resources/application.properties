spring.application.name=agent-desktop-backend

# Server Configuration
server.port=8080

# Database Configuration (H2 for demo)
spring.datasource.url=jdbc:h2:mem:bankingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Llama3 API Configuration
llama3.api.url=http://localhost:11434/api/generate

# Logging
logging.level.com.accenture.banking=DEBUG
logging.level.org.springframework.web=INFO
